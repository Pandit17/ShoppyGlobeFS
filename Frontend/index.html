<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ==========================================
         Document Metadata
         ========================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ShoppyGlobe is a React-based e-commerce application built with Vite, Redux Toolkit, and React Router."
    />

    <title>ShoppyGlobe E-Commerce</title>

    <!-- Application Favicon -->
    <link rel="icon" type="image/png" href="/src/assets/favicon.ico" />

    <!-- Global Font (Inter) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Root container for React application -->
    <div id="root"></div>

    <!-- Portal root for modal-based components -->
    <div id="modal"></div>

    <!-- Portal root for toast notifications -->
    <div id="toast"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ==========================================
         PayPal JavaScript SDK (Sandbox)
         Used for checkout and card-based payments
         ========================================== -->
    <script
      src="https://www.paypal.com/sdk/js?client-id=ATW-G05fpFuFdYOuVoLPZdeMSNtBEK0fEQBnQH5OG2jdZ5QESbEs_nhuZZLk67qaOkzRkroLCgAm2Ye4&currency=USD&intent=capture&components=buttons,funding-eligibility"
      data-sdk-integration-source="button-factory"
    ></script>
  </body>
</html>
